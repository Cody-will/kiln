[package]
name = "kiln_codegen"
description = "Native code generation for Kiln: monomorphizes MIR and lowers it with Cranelift."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kiln_lexer = { path = "../kiln_lexer" }
kiln_parser = { path = "../kiln_parser" }
kiln_resolve = { path = "../kiln_resolve" }
kiln_typeck = { path = "../kiln_typeck" }
kiln_mir = { path = "../kiln_mir" }
kiln_borrowck = { path = "../kiln_borrowck" }
cranelift-codegen = "0.116"
cranelift-frontend = "0.116"
cranelift-module = "0.116"
cranelift-object = "0.116"
cranelift-native = "0.116"
kiln_runtime = { path = "../kiln_runtime" }

[target.'cfg(windows)'.dependencies]
cc = "1"

[lints]
workspace = true
