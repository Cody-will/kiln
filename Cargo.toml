[workspace]
resolver = "2"
members = ["crates/kiln_lexer", "crates/kiln_parser", "crates/kiln_cli", "crates/kiln_resolve", "crates/kiln_typeck", "crates/kiln_mir", "crates/kiln_borrowck", "crates/kiln_runtime", "crates/kiln_codegen", "crates/kiln_fmt", "crates/kiln_lsp"]
exclude = ["crates/kiln_tls"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
