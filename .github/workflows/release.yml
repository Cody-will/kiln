# Builds the release archives (tools/release.sh, tools/release.ps1) on
# x86_64/aarch64 Linux, x86_64/arm64 macOS, and x86_64 Windows, and attaches
# them, with install.sh and install.ps1, to the GitHub release for the tag.
# workflow_dispatch builds and uploads artifacts only; publishing needs a tag.
# Ubuntu 22.04 runners give the binaries a glibc 2.35 baseline.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: clang and lld
        # Kiln emits opaque-pointer LLVM IR (`ptr`); needs clang 15+.
        # Ubuntu 22.04's default `clang` package is still 14.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 lld-15
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 150
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 150
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-15 150 || true
          clang --version
      - name: build the tarball
        env:
          KILN_CLANG: clang-15
        run: tools/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.sha256
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15] # x86_64, arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: clang --version
      - name: build the tarball
        run: tools/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.sha256
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: clang --version
      - name: build the archive
        shell: pwsh
        run: tools/release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            target/dist/*.zip
            target/dist/*.sha256
  publish:
    needs: [build, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $GITHUB_REF_NAME " 'index($0, v) == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Kiln $GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* install.sh install.ps1 --clobber
