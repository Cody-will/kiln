# Builds the release tarballs (tools/release.sh) on x86_64 and aarch64 Linux
# and attaches them, with install.sh, to the GitHub release for the tag.
# Ubuntu 22.04 runners give the binaries a glibc 2.35 baseline.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: clang and lld
        # Kiln emits opaque-pointer LLVM IR (`ptr`); needs clang 15+.
        # Ubuntu 22.04's default `clang` package is still 14.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 lld-15
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 150
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 150
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-15 150 || true
          clang --version
      - name: build the tarball
        env:
          KILN_CLANG: clang-15
        run: tools/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.sha256
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Kiln $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* install.sh --clobber
