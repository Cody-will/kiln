name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux only for now (GitHub billing: macOS and Windows runners
        # cost more minutes). To re-enable them, replace the line below
        # with the commented one.
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: bounded fuzz smoke (front end)
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --release -p kiln_fuzz -- --iters 2000 --seed 1

  dogfood:
    name: dogfood (todo_api + live PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: secretpw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://kiln:secretpw@127.0.0.1:5432/postgres
      KILN_TEST_PG_URL: postgres://kiln:secretpw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kiln_cli
      - name: build kilnc
        working-directory: compiler
        run: ../target/release/kiln build --release
      - name: todo_api end to end
        env:
          KILNC: ${{ github.workspace }}/compiler/target/release/kilnc
        run: examples/todo_api_test.sh "$PWD/target/release/kiln"
      - name: std::db::postgres against the live server
        run: cargo test --release -p kiln_cli --test run postgres_live

  editors:
    name: editor grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: VS Code TextMate grammar
        working-directory: editors/vscode
        run: npm ci && npm test
      - name: Tree-sitter grammar
        working-directory: editors/tree-sitter-kiln
        run: |
          npm ci
          npx tree-sitter generate
          git diff --exit-code src/ || (echo "src/ is stale: run tree-sitter generate" && exit 1)
          npx tree-sitter test
          npx tree-sitter parse --quiet ../../examples/*.kn

  website:
    name: website builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: mdbook build website
